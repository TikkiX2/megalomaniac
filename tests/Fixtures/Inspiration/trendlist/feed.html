<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Trend List</title>
</head>
<body>
    <div class="gallery">
        <!-- Card 1: relative href resolved through the adapter base. -->
        <div class="gallery-item">
            <a class="gallery-link" href="/trends/swiss-brutalism/">
                <img src="https://trendlist.org/images/swiss-brutalism.jpg" alt="Swiss Brutalism">
            </a>
            <div class="gallery-title">Swiss Brutalism</div>
        </div>

        <!-- Card 2: absolute href plus a lazy data-src image. -->
        <div class="gallery-item">
            <a class="gallery-link" href="https://trendlist.org/trends/y2k-revival/">
                <img data-src="//trendlist.org/images/y2k-revival.jpg" alt="Y2K Revival">
            </a>
            <div class="gallery-title">Y2K Revival</div>
        </div>
    </div>
</body>
</html>
