<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>PosterSpy</title>
</head>
<body>
    <main id="content">
        <!-- Card 1: article wrapper, relative href. -->
        <article class="poster">
            <a class="poster-thumb" href="/post/alien-harvest/">

            <h2 class="entry-title"><a href="/post/alien-harvest/">Alien Harvest</a></h2>

        <!-- Card 2: absolute href plus a lazy data-src image. -->

            <a class="poster-thumb" href="https://posterspy.com/post/midnight-run/">
                <img data-src="//cdn.posterspy.com/uploads/midnight-run.jpg" alt="Midnight Run">
            </a>
            <h2 class="entry-title"><a href="https://posterspy.com/post/midnight-run/">Midnight Run</a></h2>
        </article>
    </main>
</body>
</html>
