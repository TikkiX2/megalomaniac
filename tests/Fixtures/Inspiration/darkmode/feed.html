<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Dark Mode Design — Handpicked website inspiration</title>
</head>
<body>
    <section class="sites">
        <!-- Card 1: relative screenshot path resolved through the adapter base. -->
        <div class="site">
            <a class="site__link" href="https://loaf.co/">
                <img src="/screenshots/loaf.png" alt="Loaf">
            </a>
            <h3 class="site__name">Loaf</h3>
        </div>

        <!-- Card 2: protocol-relative screenshot. -->
        <div class="site">
            <a class="site__link" href="https://nextmobbin.app/">
                <img data-src="//www.darkmodedesign.com/screenshots/nextmobbin.png" alt="NextMobbin">
            </a>
            <h3 class="site__name">NextMobbin</h3>
        </div>

        <!-- Card 3: srcset-only screenshot. -->
        <div class="site">
            <a class="site__link" href="https://tinycomputer.co/">
                <img srcset="https://www.darkmodedesign.com/screenshots/tiny-computer-1200.png 1200w" alt="Tiny Computer">
            </a>
            <h3 class="site__name">Tiny Computer Co.</h3>
        </div>
    </section>
</body>
</html>
