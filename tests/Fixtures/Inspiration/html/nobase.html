<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>No base</title>
</head>
<body>
    <div class="grid">
        <!-- Absolute URLs survive without any base. -->
        <div class="card">
            <a class="card-link" href="https://absolute.test/p/1">
                <img src="https://cdn.test/1.jpg" alt="Absolute">
            </a>
        </div>

        <!-- Protocol-relative URL: no scheme, and no base to borrow it from. -->
        <div class="card">
            <a class="card-link" href="/relative/p/2">
                <img src="//cdn.test/2.jpg" alt="Protocol relative">
            </a>
        </div>

        <!-- Fully relative URL. -->
        <div class="card">
            <a class="card-link" href="p/3">
                <img src="img/3.jpg" alt="Relative">
            </a>
        </div>
    </div>
</body>
</html>
