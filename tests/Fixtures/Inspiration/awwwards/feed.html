<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Awwwards — Websites</title>
</head>
<body>
    <!--
        Mirrors the live /websites/ grid: li.js-collectable > figure > a.figure-rollover__link
        wrapping the screenshot, with the project name in the second
        .figure-rollover__row. The live image carries data-srcset plus a base64
        placeholder src; the fixture uses a plain srcset because the shared
        HtmlParser does not read data-srcset (documented in AwwwardsSource).
    -->
    <ul class="grid-cards js-ajax-entries">
        <!-- Card 1: srcset-only screenshot on the assets CDN. -->
        <li class="col-3 js-collectable">
            <div class="card-site js-container-figure">
                <figure class="figure-rollover">
                    <a aria-label="EDOLUS" class="figure-rollover__link" href="/sites/edolus">
                        <img class="lazy figure-rollover__file" srcset="https://assets.awwwards.com/awards/media/cache/thumb_440_330/submissions/edolus.png 1x, https://assets.awwwards.com/awards/media/cache/thumb_880_660/submissions/edolus.png 2x" alt="EDOLUS">
                    </a>
                    <div class="figure-rollover__hover">
                        <div class="figure-rollover__left">
                            <div class="figure-rollover__row">WEBSITE</div>
                            <div class="figure-rollover__row">EDOLUS</div>
                        </div>
                    </div>
                </figure>
            </div>
        </li>

        <!-- Card 2: relative src resolved through the adapter base. -->
        <li class="col-3 js-collectable">
            <div class="card-site js-container-figure">
                <figure class="figure-rollover">
                    <a aria-label="Milledollars" class="figure-rollover__link" href="/sites/milledollars">
                        <img class="lazy figure-rollover__file" src="/media/thumb/milledollars.png" alt="Milledollars">
                    </a>
                    <div class="figure-rollover__hover">
                        <div class="figure-rollover__left">
                            <div class="figure-rollover__row">WEBSITE</div>
                            <div class="figure-rollover__row">Milledollars</div>
                        </div>
                    </div>
                </figure>
            </div>
        </li>

        <!-- Card 3: lazy data-src screenshot. -->
        <li class="col-3 js-collectable">
            <div class="card-site js-container-figure">
                <figure class="figure-rollover">
                    <a aria-label="Colonia Zacamil" class="figure-rollover__link" href="/sites/colonia-zacamil">
                        <img class="lazy figure-rollover__file" data-src="//assets.awwwards.com/awards/media/cache/thumb_440_330/submissions/colonia-zacamil.png" alt="Colonia Zacamil">
                    </a>
                    <div class="figure-rollover__hover">
                        <div class="figure-rollover__left">
                            <div class="figure-rollover__row">WEBSITE</div>
                            <div class="figure-rollover__row">Colonia Zacamil</div>
                        </div>
                    </div>
                </figure>
            </div>
        </li>
    </ul>
</body>
</html>
